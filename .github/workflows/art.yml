name: Cache art & rebuild cards

# The build sandbox can't reach the 80+ image hosts the ledger points at.
# Actions can. So art caching and card rendering happen here, on push, and the
# results are committed back — nothing to remember, nothing to run by hand.

on:
  push:
    branches: [main]
    paths:
      - 'ledger.json'
      - 'musa-50.json'
      - 'build/**'
      - '.github/workflows/art.yml'
  workflow_dispatch:
    inputs:
      force_cards:
        description: 'Re-render every card from scratch'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: musa-art
  cancel-in-progress: false

jobs:
  art:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps for cairosvg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0

      - name: Python deps
        run: pip install --quiet pillow cairosvg

      - name: Cache entry artwork
        run: python build/fetch_art.py

      - name: Rebuild pages, cards and /share/
        env:
          MUSA_FORCE_CARDS: ${{ inputs.force_cards && '1' || '0' }}
        run: python build/publish.py

      - name: Commit rebuild
        run: |
          git config user.name  "MUSA Index Bot"
          git config user.email "index@themusafamily.com"
          git add -A
          if git diff --cached --quiet; then
            echo "rebuild produced no changes"
          else
            git commit -m "Cache entry art and rebuild cards [skip ci]"
          fi

      # version.txt must name the commit whose tree actually gets uploaded, so it
      # is written AFTER the rebuild commit exists and committed on top of it.
      # The deployed tree therefore carries a version.txt pointing at HEAD~1.
      # Writing it before the rebuild (the old session-side behaviour) recorded a
      # parent hash and left /version.txt permanently out of step with the edge.
      - name: Stamp version
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > version.txt
          git rev-parse --short HEAD >> version.txt
          git add version.txt
          git commit -m "version: stamp $(git rev-parse --short HEAD) [skip ci]"
          git push
          echo "stamped:"; cat version.txt

      - name: Deploy to Cloudflare
        if: env.CF_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      # Deploy is the whole point of this workflow. If the secret is missing the
      # push looks completely successful while the site stays frozen, so fail the
      # run loudly rather than skipping quietly.
      - name: Deploy skipped — site NOT live
        if: env.CF_TOKEN == ''
        run: |
          echo "::error title=Not deployed::CLOUDFLARE_API_TOKEN is not set, so the"\
               "commit landed in git but nothing reached archive.themusafamily.com."
          echo "Fix once: Settings > Secrets and variables > Actions >"
          echo "  CLOUDFLARE_API_TOKEN   (Workers Scripts: Edit + Account Settings: Read)"
          echo "  CLOUDFLARE_ACCOUNT_ID"
          echo "Until then, deploy by hand: npx wrangler deploy"
          exit 1
